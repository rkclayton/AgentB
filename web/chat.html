<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent_b</title>
  <link rel="icon" href="/static/assets/Agent_b.ico" type="image/x-icon">
  <link rel="manifest" href="/static/app.webmanifest">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body class="chat-page">
  <header class="chat-header window-titlebar">
    <div class="chat-brand"><img src="/static/assets/mark.svg" alt=""><span>Agent_b</span></div>
    <div id="chat-binding"></div>
    <span id="chat-status"></span>
    <span id="connection" role="status"></span>
    <nav class="chat-nav" aria-label="Application">
      <a id="chat-current" class="chat-header-action selected" href="/chat" aria-current="page">Chat</a>
      <button id="chat-stop" class="chat-header-action chat-stop" type="button">Stop</button>
      <a id="chat-console" class="chat-header-action" href="/">Console</a>
      <a id="chat-settings" class="chat-icon-button" href="/#settings/servers" aria-label="Settings" title="Settings">⚙</a>
    </nav>
  </header>
  <div id="chat-identity-alarm" class="chat-identity-alarm" role="alert" hidden></div>
  <div id="chat-budget" class="chat-budget" aria-label="Context budget"><span class="chat-budget-fill"></span><span class="chat-budget-tip"></span></div>
  <main id="chat-log" class="chat-log" tabindex="0" aria-live="polite"></main>
  <footer class="chat-composer">
    <textarea id="chat-task" rows="1" aria-label="Task" placeholder="Send a task"></textarea>
    <button id="chat-send" type="button">Send</button>
    <div id="chat-notice" class="chat-notice" role="status"></div>
  </footer>
  <script type="module" src="/static/js/chat.js"></script>
</body>
</html>
