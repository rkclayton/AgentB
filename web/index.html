<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent_b</title>
  <link rel="icon" href="/static/assets/Agent_b.ico" type="image/x-icon">
  <link rel="manifest" href="/static/app.webmanifest">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header id="app-shell" class="app-shell window-titlebar" data-page="console"></header>
  <section id="rail" class="rail" aria-label="Context budget"></section>
  <main class="grid">
    <section class="well flow-well">
      <header class="panel-caption"><span>Activity</span><span id="flow-count"></span></header>
      <div id="flow" class="flow"></div>
    </section>
    <section class="well rack-well">
      <header class="panel-caption"><span>Tools</span><span id="tool-count"></span></header>
      <div id="rack" class="rack"></div>
    </section>
    <section class="well state-well">
      <header class="panel-caption"><span>Context</span><span id="state-count"></span></header>
      <div id="state-list" class="panel-scroll"></div>
    </section>
		<section class="well timeline-well">
			<header class="panel-caption"><span>History</span><span class="history-controls"><span id="timeline-count"></span><button id="drop-last-message" type="button">Drop last message</button></span></header>
			<div id="timeline-list" class="panel-scroll"></div>
			<div id="console-pending-approval" class="pending-approval" hidden></div>
		</section>
  </main>
  <section id="settings-page" class="settings-page" aria-label="Settings" aria-hidden="true" hidden></section>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
