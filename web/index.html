<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent_b</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="header">
    <div class="brand"><img src="/static/assets/mark.svg" alt=""><span>Agent_b</span><span id="mode" class="mode"></span></div>
    <div id="connection" role="status"></div>
    <a id="chat-launch" class="header-action" href="/chat" target="agent_b_chat">Chat</a>
    <button id="stop" class="stop" type="button">Stop</button>
    <button id="settings" class="icon-button" type="button" aria-label="Settings">⚙</button>
  </header>
  <div id="shell-identity-alarm" class="identity-alarm" role="alert" hidden></div>
  <nav id="tabs" class="tabs" aria-label="Sessions"></nav>
  <section id="rail" class="rail" aria-label="Context budget"></section>
  <main class="grid">
    <section class="well flow-well">
      <header class="panel-caption"><span>Flow</span><span id="flow-count"></span></header>
      <div id="flow" class="flow"></div>
      <form id="composer" class="composer"><input id="task" autocomplete="off" aria-label="Task" placeholder="Send a task"><button type="submit">Send</button></form>
    </section>
    <section class="well rack-well">
      <header class="panel-caption"><span>Tools</span><span id="tool-count"></span></header>
      <div id="rack" class="rack"></div>
    </section>
    <section class="well state-well">
      <header class="panel-caption"><span>State</span><span id="state-count"></span></header>
      <nav id="state-filters" class="state-filters" aria-label="State categories"></nav>
      <div id="state-list" class="panel-scroll"></div>
    </section>
    <section class="well timeline-well">
      <header class="panel-caption"><span>Timeline</span><span id="timeline-count"></span></header>
      <div id="timeline-list" class="panel-scroll"></div>
    </section>
  </main>
  <section id="settings-page" class="settings-page" aria-label="Settings" aria-hidden="true" hidden></section>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
