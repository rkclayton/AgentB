<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent_b</title>
  <link rel="icon" href="/static/assets/Agent_b.ico" type="image/x-icon">
  <link rel="manifest" href="/static/app.webmanifest">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="header window-titlebar">
    <nav id="tabs" class="tabs" aria-label="Sessions"></nav>
    <span id="mode" class="mode"></span>
    <div id="connection" role="status"></div>
    <nav class="app-nav" aria-label="Application">
      <button id="stop" class="stop-sign" type="button" aria-label="Stop" title="Stop"><span aria-hidden="true"></span></button>
      <button id="operator-status" class="operator-status" type="button" aria-label="Operator mode off" aria-pressed="false" title="Operator mode off" disabled><img src="/static/assets/operator-off-24.png" srcset="/static/assets/operator-off-48.png 2x" width="24" height="24" alt=""></button>
      <a id="chat-launch" class="header-action" href="/chat">Chat</a>
      <a id="console-launch" class="header-action selected" href="/" aria-current="page">Console</a>
      <button id="settings" class="icon-button" type="button" aria-label="Settings" title="Settings">⚙</button>
    </nav>
  </header>
  <div id="shell-identity-alarm" class="identity-alarm" role="alert" hidden></div>
  <section id="rail" class="rail" aria-label="Context budget"></section>
  <main class="grid">
    <section class="well flow-well">
      <header class="panel-caption"><span>Activity</span><span id="flow-count"></span></header>
      <div id="flow" class="flow"></div>
      <form id="composer" class="composer"><input id="task" autocomplete="off" aria-label="Task" placeholder="Send a task"><button type="submit">Send</button></form>
    </section>
    <section class="well rack-well">
      <header class="panel-caption"><span>Tools</span><span id="tool-count"></span></header>
      <div id="rack" class="rack"></div>
    </section>
    <section class="well state-well">
      <header class="panel-caption"><span>Context</span><span id="state-count"></span></header>
      <div id="state-list" class="panel-scroll"></div>
    </section>
    <section class="well timeline-well">
      <header class="panel-caption"><span>History</span><span id="timeline-count"></span></header>
      <div id="timeline-list" class="panel-scroll"></div>
    </section>
  </main>
  <section id="settings-page" class="settings-page" aria-label="Settings" aria-hidden="true" hidden></section>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
